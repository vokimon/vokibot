splash_motto: شغّل أي إجراء باستخدام أي مُطلِق
short_description: أداة أتمتة لأندرويد
full_description_md: |
  يجعل جهاز أندرويد الخاص بك ينفذ إجراءات (أوامر) كلما حدث شيء ما (مُطلِقات).

  المُطلِقات المُنفَّذة:

  - علامات NFC (إعدادها عن طريق النقر)
  - الاختصارات (إنشاء أيقونات في المشغل)
  - أجهزة البلوتوث (عند الاتصال بها)

  الأوامر المُنفَّذة:

  - تفعيل مكونات التطبيق: الأنشطة، الخدمات، المستقبلات
  - فتح صفحات إعدادات النظام
  - توصيل أو فصل أجهزة البلوتوث
keywords: أتمتة, NFC, مؤقت, اختصار
