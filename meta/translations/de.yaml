splash_motto: Jede Aktion mit jedem Auslöser starten
short_description: Android-Automatisierungstool
full_description_md: |
  Lässt dein Android-Gerät Aktionen (Befehle) ausführen, wenn etwas passiert (Auslöser).

  Implementierte Auslöser:

  - Zeit (zu einer bestimmten Zeit oder periodisch)
  - NFC-Tags (durch Antippen konfigurieren)
  - Verknüpfung (erstellt ein Launcher-Symbol)
  - Bluetooth-Geräte (beim Verbinden)

  Implementierte Befehle:

  - Mit anderen Anwendungen interagieren (über Aktivitäten, Dienste oder Empfänger)
  - Systemkonfigurationsparameter ändern
  - Systemkonfigurationsseiten oder Schnellzugriff-Panels öffnen
  - Bluetooth-Geräte verbinden oder trennen
keywords: automatisierung, nfc, timer, kurztaste, bluetooth
