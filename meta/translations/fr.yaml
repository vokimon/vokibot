splash_motto: Exécutez n'importe quelle action avec n'importe quel déclencheur
short_description: Outil d'automatisation pour Android
full_description_md: |
  Permet à votre appareil Android d'effectuer des actions (commandes) lorsque quelque chose se produit (déclencheurs).

  Déclencheurs implémentés :

  - Temps (à une heure donnée ou périodiquement)
  - Étiquettes NFC (configurer en tapant)
  - Raccourci (crée une icône dans le lanceur)
  - Appareils Bluetooth (lors de la connexion)

  Commandes implémentées :

  - Interagir avec d'autres applications (via Activités, Services ou Récepteurs)
  - Modifier les paramètres de configuration du système
  - Ouvrir les pages de configuration du système ou les panneaux rapides
  - Connecter ou déconnecter des appareils Bluetooth
keywords: automatisation, nfc, minuterie, raccourci, bluetooth
