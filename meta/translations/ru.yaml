splash_motto: Запускайте любые действия с помощью любых триггеров
short_description: Инструмент автоматизации для Android
full_description_md: |
  Заставляет ваше Android-устройство выполнять действия (команды),
  когда что-то происходит (триггеры).

  Реализованные триггеры:

  - NFC-метки (настройка касанием)
  - Ярлыки (создает иконки на рабочем столе)
  - Bluetooth-устройства (при подключении)

  Реализованные команды:

  - Активация компонентов приложения (Активности, Службы, Приемники)
  - Открытие страниц настроек системы
keywords: автоматизация, нфк, таймер, ярлык
