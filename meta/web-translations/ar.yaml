LANGUAGE_NAME: العربية
MOTTO: شغّل أي إجراء باستخدام أي مُطلِق
DESCRIPTION: أداة أتمتة لأندرويد
KEYWORDS: أندرويد, أتمتة, NFC, اختصار, مُطلِق, برمجيات حرة, مفتوح المصدر
FEATURE_MULTIPLE_TRIGGERS_TITLE: اختر مُطلِقًا
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  يمكنك استخدام <b>علامات NFC</b> و<b>اختصارات الشاشة الرئيسية</b> كمُطلِقات لأتمتتك.
  مصمم ليكون <b>قابلاً للتوسع</b>،
  مع خطط لإضافة مُطلِقات أخرى في المستقبل مثل
  أحداث النظام، الإيماءات، وكشف الواي فاي/البلوتوث…
FEATURE_MULTIPLE_COMMANDS_TITLE: اختر ما تريد تشغيله
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  ماذا يمكنك أتمتة؟
  حالياً، يمكنك <b>فتح أي تطبيق</b>
  أو الانتقال مباشرة إلى شاشة محددة داخله.
  يمكنك أيضاً الانتقال مباشرة إلى <b>صفحة إعدادات نظام</b> محددة.
  امتدادات مستقبلية: تبديل الإعدادات، تشغيل نصوص ADB، تشغيل نصوص Python…
FEATURE_FREEDOM_AS_FEATURE_TITLE: الحرية كميزة
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  تحمي رخصة AGPLv3 حرياتك كمستخدم.
  يتم صيانة الكود من قبل المجتمع ويمكن لأي شخص مراجعته.
  لا برامج تجسس. لا جمع للبيانات. لا إعلانات خفية.
  تضمن F-Droid أن الملفات الثنائية تُولد فقط من المصدر المنشور دون إضافات مخفية.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: الكود المصدري
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 أو أحدث
FEATURE_TRANSLATIONS_TITLE: الترجمات
FEATURE_TRANSLATIONS_DESCRIPTION: |
  نولي عناية خاصة لدعم اللغات الأقلية والإقليمية.
  هذا جهد مجتمعي؛ ترجم لغتك الخاصة باستخدام Weblate.
