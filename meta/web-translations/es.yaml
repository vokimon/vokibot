LANGUAGE_NAME: Español
MOTTO: Ejecuta cualquier acción con cualquier disparador
DESCRIPTION: Herramienta de automatización para Android
KEYWORDS: android, automatización, nfc, acceso directo, disparador, floss, foss, código abierto, software libre
FEATURE_MULTIPLE_TRIGGERS_TITLE: Elige un disparador
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Puedes usar <b>etiquetas NFC</b>,
  <b>accesos directos en la pantalla de inicio</b>
  y <b>dispositivos Bluetooth</b>
  como disparadores para tus automatizaciones.
  Diseñado para ser <b>extensible</b>,
  con más disparadores planeados para el futuro como
  eventos del sistema, gestos, detección Wi-Fi…
FEATURE_MULTIPLE_COMMANDS_TITLE: Elige qué ejecutar
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  ¿Qué puedes automatizar?
  Actualmente, puedes <b>abrir cualquier aplicación</b>
  o saltar directamente a una pantalla específica dentro de ella.
  También puedes saltar directamente a una <b>página de ajustes del sistema</b> específica.
  Extensiones futuras: Cambiar ajustes, ejecutar scripts ADB, ejecutar scripts Python…
FEATURE_FREEDOM_AS_FEATURE_TITLE: La libertad como funcionalidad
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  AGPLv3 protege tus libertades como usuario.
  El código es mantenido por la comunidad y cualquiera puede auditarlo.
  Sin spyware. Sin recopilación de datos. Sin publicidad encubierta.
  F-Droid asegura que los binarios se generan únicamente desde el código fuente publicado sin adiciones ocultas.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Código fuente
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 o posterior
FEATURE_TRANSLATIONS_TITLE: Traducciones
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Se presta especial atención al soporte de lenguas minoritarias y regionales.
  Este es un esfuerzo comunitario; traduce tu idioma con Weblate.
