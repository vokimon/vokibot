LANGUAGE_NAME: Català
MOTTO: Executa qualsevol acció amb qualsevol disparador
DESCRIPTION: Eina d'automatització per a Android
KEYWORDS: android, automatització, nfc, drecera, disparador, floss, foss, codi obert, programari lliure
FEATURE_MULTIPLE_TRIGGERS_TITLE: Tria un disparador
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Pots utilitzar <b>etiquetes NFC</b> i <b>dreceres de la pantalla d'inici</b> com a disparadors per a les teves automatitzacions.
  Dissenyat per ser <b>extensible</b>,
  amb més disparadors previstos per al futur com ara
  esdeveniments del sistema, gestos, detecció Wi-Fi/Bluetooth…
FEATURE_MULTIPLE_COMMANDS_TITLE: Tria què executar
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Què pots automatitzar?
  Actualment, pots <b>obrir qualsevol aplicació</b>
  o saltar directament a una pantalla específica dins d'ella.
  També pots saltar directament a una <b>pàgina de configuració del sistema</b> específica.
  Extensions futures: Canviar configuracions, executar scripts ADB, executar scripts Python…
FEATURE_FREEDOM_AS_FEATURE_TITLE: Llibertat com a funcionalitat
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  L'AGPLv3 protegeix les teves llibertats com a usuari.
  El codi és mantingut per la comunitat i qualsevol pot auditar-lo.
  Sense spyware. Sense recollida de dades. Sense publicitat encoberta.
  F-Droid assegura que els binaris es generen només des del codi font publicat sense addicions ocultes.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Codi font
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 o posterior
FEATURE_TRANSLATIONS_TITLE: Traduccions
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Es presta especial atenció al suport de llengües minoritàries i regionals.
  Aquest és un esforç comunitari; tradueix la teva llengua amb Weblate.
