LANGUAGE_NAME: Català
MOTTO: Executa qualsevol acció amb qualsevol disparador
DESCRIPTION: Eina d'automatització per a Android
KEYWORDS: android, automatització, nfc, drecera, disparador, floss, foss, codi obert, programari lliure
FEATURE_MULTIPLE_TRIGGERS_TITLE: Tria un disparador
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Pots utilitzar <b>etiquetes NFC</b>,
  <b>dreceres de la pantalla d'inici</b>
  i <b>dispositius Bluetooth</b>
  com a disparadors per a les teves automatitzacions.
  Dissenyat per ser <b>extensible</b>,
  amb més disparadors previstos per al futur com ara
  esdeveniments del sistema, gestos, detecció Wi-Fi…
FEATURE_MULTIPLE_COMMANDS_TITLE: Tria què executar
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Què pots automatitzar?
  Actualment, pots <b>invocar altres aplicacions</b>
  obrint pantalles específiques, iniciant serveis o enviant missatges.
  També pots canviar <b>configuracions del sistema</b>, obrir panells de configuració ràpida o anar a pàgines de configuració específiques.
  I finalment, pots <b>connectar i desconnectar dispositius Bluetooth</b>.
  Més comandes estan en camí!
FEATURE_FREEDOM_AS_FEATURE_TITLE: La llibertat com a funcionalitat
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  La llicència AGPLv3 protegeix la teva llibertat com a usuària.
  El codi és mantingut per la comunitat i tothom el pot auditar.
  Sense espies. Sense recollida de dades. Sense publicitat encoberta.
  F-Droid assegura que els instal·lables són generats amb el codi publicat sense addicions ocultes.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Codi font
