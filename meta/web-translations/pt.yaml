LANGUAGE_NAME: Português
MOTTO: Executa qualquer ação usando qualquer acionador
DESCRIPTION: Ferramenta de automação para Android
KEYWORDS: android, automação, nfc, atalho, acionador, floss, foss, código aberto, software livre
FEATURE_OFFICIAL_DATA_TITLE: Dados oficiais
FEATURE_OFFICIAL_DATA_DESCRIPTION: |
  Usamos dados oficiais enviados pelos postos de combustível aos reguladores.
  Atualmente cobrimos Portugal, Espanha e França.
FEATURE_OFFICIAL_DATA_ACTION_ADD_COUNTRY: Adicionar o meu país
FEATURE_RELEVANT_STATIONS_TITLE: Apenas postos relevantes
FEATURE_RELEVANT_STATIONS_DESCRIPTION: |
  Carburoid descarta postos mais caros que outros mais próximos.
  Isto reduz a lista de candidatos de milhares para algumas dezenas.
FEATURE_YOUR_CHOICE_TITLE: Tu escolhes
FEATURE_YOUR_CHOICE_DESCRIPTION: |
  Os preços melhoram à medida que desce a lista, mas as distâncias também aumentam.
  Cabe-te a ti decidir até onde vale a pena ir para as poupanças.
FEATURE_ROUND_TRIP_DETOUR_MODES_TITLE: Modos de ida e volta e desvios
FEATURE_ROUND_TRIP_DETOUR_MODES_DESCRIPTION: |
  O modo de ida e volta considera apenas a distância entre a sua posição e o posto de combustível.
  Ao definir um ponto de destino, utiliza-se a distância do desvio.
FEATURE_FREEDOM_AS_FEATURE_TITLE: Liberdade como funcionalidade
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  A AGPLv3 protege as tuas liberdades enquanto utilizador.
  O código é mantido pela comunidade e qualquer pessoa pode auditá-lo.
  Sem spyware. Sem recolha de dados. Sem publicidade disfarçada.
  O F-Droid garante que os binários são gerados apenas a partir do código fonte publicado, sem adições ocultas.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Código fonte
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 ou posterior
FEATURE_TRANSLATIONS_TITLE: Traduções
FEATURE_TRANSLATIONS_DESCRIPTION: |
  É dada especial atenção ao suporte de línguas minoritárias e regionais.
  Este é um esforço comunitário; traduz o teu idioma com o Weblate.
FEATURE_TRANSLATIONS_ACTION_WEBLATE: Traduzir
ACTION_FDROID: Obtém no F-Droid
ACTION_DONATE: Doar
ACTION_SOCIAL: Segue-nos
ACTION_GOOGLE_PLAY: Google Play
ACTION_APP_STORE: App Store
COOKIE_NOTICE: Este site não utiliza cookies. Importamo-nos realmente com a tua privacidade.
FEATURE_MULTIPLE_TRIGGERS_TITLE: Escolhe um acionador
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Podes usar <b>etiquetas NFC</b> e <b>atalhos no ecrã inicial</b> como acionadores para as tuas automações.
  Concebido para ser <b>extensível</b>,
  com mais acionadores planeados para o futuro, como
  eventos do sistema, gestos, deteção Wi-Fi/Bluetooth…
FEATURE_MULTIPLE_COMMANDS_TITLE: Escolhe o que executar
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  O que podes automatizar?
  Atualmente, podes <b>abrir qualquer aplicação</b>
  ou saltar diretamente para um ecrã específico dentro dela.
  Também podes saltar diretamente para uma <b>página de definições do sistema</b> específica.
  Extensões futuras: Alternar definições, executar scripts ADB, executar scripts Python…
