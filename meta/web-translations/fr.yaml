LANGUAGE_NAME: Français
MOTTO: Exécutez n'importe quelle action avec n'importe quel déclencheur
DESCRIPTION: Outil d'automatisation pour Android
KEYWORDS: android, automatisation, nfc, raccourci, déclencheur, floss, foss, open source, logiciel libre
FEATURE_MULTIPLE_TRIGGERS_TITLE: Choisissez un déclencheur
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Vous pouvez utiliser des <b>balises NFC</b>,
  des <b>raccourcis sur l'écran d'accueil</b>
  et des <b>appareils Bluetooth</b>
  comme déclencheurs pour vos automatisations.
  Conçu pour être <b>extensible</b>,
  avec d'autres déclencheurs prévus à l'avenir tels que
  les événements système, les gestes, la détection Wi-Fi…
FEATURE_MULTIPLE_COMMANDS_TITLE: Choisissez quoi exécuter
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Que pouvez-vous automatiser ?
  Actuellement, vous pouvez <b>ouvrir n'importe quelle application</b>
  ou accéder directement à un écran spécifique à l'intérieur.
  Vous pouvez également accéder directement à une <b>page de paramètres système</b> spécifique.
  Extensions futures : Basculer les paramètres, exécuter des scripts ADB, exécuter des scripts Python…
FEATURE_FREEDOM_AS_FEATURE_TITLE: La liberté comme fonctionnalité
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  L'AGPLv3 protège vos libertés en tant qu'utilisateur.
  Le code est maintenu par la communauté et n'importe qui peut l'auditer.
  Pas de spyware. Pas de collecte de données. Pas de placement de produit.
  F-Droid garantit que les binaires sont générés uniquement à partir du code source publié sans ajouts cachés.
