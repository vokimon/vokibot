FEATURE_MULTIPLE_TRIGGERS_TITLE: Aukeratu abiarazle bat
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  <b>NFC etiketak</b> eta <b>hasierako pantailako lasterbideak</b> erabil ditzakezu zure automatizazioetarako abiarazle gisa.
  <b>Hedagarria</b> izateko diseinatuta,
  etorkizunerako abiarazle gehiago aurreikusita, hala nola
  sistemako gertaerak, keinuak, Wi-Fi/Bluetooth detekzioa…
FEATURE_MULTIPLE_COMMANDS_TITLE: Aukeratu zer exekutatu
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Zer automatiza dezakezu?
  Une honetan, <b>edozein aplikazio ireki</b> dezakezu
  edo bertako pantaila zehatz batera zuzenean jauzi egin.
  Sistemako ezarpen-orri zehatz batera ere zuzenean jauzi egin dezakezu.
  Etorkizuneko hedapenak: Ezarpenak aldatu, ADB scriptak exekutatu, Python scriptak exekutatu…
