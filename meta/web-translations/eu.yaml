LANGUAGE_NAME: Euskara
MOTTO: Exekutatu edozein ekintza edozein abiarazlerekin
DESCRIPTION: Androiderako automatizazio tresna
KEYWORDS: android, automatizazioa, nfc, lasterbidea, abiarazlea, floss, foss, kode irekia, software librea
FEATURE_MULTIPLE_TRIGGERS_TITLE: Aukeratu abiarazle bat
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  <b>NFC etiketak</b>,
  <b>hasierako pantailako lasterbideak</b>
  eta <b>Bluetooth gailuak</b>
  erabil ditzakezu zure automatizazioetarako abiarazle gisa.
  <b>Hedagarria</b> izateko diseinatuta,
  etorkizunerako abiarazle gehiago aurreikusita, hala nola
  sistemako gertaerak, keinuak, Wi-Fi detekzioa…
FEATURE_MULTIPLE_COMMANDS_TITLE: Aukeratu zer exekutatu
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Zer automatiza dezakezu?
  Une honetan, <b>beste aplikazioak dei ditzakezu</b>
  pantaila zehatzak irekiz, zerbitzuak hasiz edo mezuak bidaliz.
  <b>Sistemako ezarpenak</b> ere alda ditzakezu, ezarpen azkarren panelak ireki edo ezarpen-orri zehatzetara joan.
  Eta azkenik, <b>Bluetooth gailuak konektatu eta deskonekta ditzakezu</b>.
  Komando gehiago bidean dira!
FEATURE_FREEDOM_AS_FEATURE_TITLE: Askatasuna ezaugarri gisa
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  AGPLv3 lizentziak zure askatasunak babesten ditu erabiltzaile gisa.
  Kodea komunitateak mantentzen du eta edonork azter dezake.
  Ez spywarerik. Ez datu-bilketa. Ez publizitate ezkuturik.
  F-Droidek ziurtatzen du binarioak argitaratutako iturburu-kodetik soilik sortzen direla, ezkutuko gehitzerik gabe.
