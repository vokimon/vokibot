DESCRIPTION: Android automation tool
KEYWORDS: android, automation, nfc, shortcut, trigger, floss, foss, opensource, free software
FEATURE_MULTIPLE_TRIGGERS_TITLE: Choose a trigger
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  You can use <b>NFC tags</b>,
  <b>home screen shortcuts</b>
  and <b>Bluetooth devices</b>
  as triggers for your automations.
  Built to be <b>extensible</b>,
  with more triggers planned for the future such as
  system events, gestures, Wi-Fi detection…
FEATURE_MULTIPLE_COMMANDS_TITLE: Choose what to run
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  What can you automate?
  Currently, you can <b>open any application</b>
  or jump to a specific screen within it.
  You can also jump directly to a specific <b>system settings page</b>.
  Future extensions: Toggle settings, run ADB scripts, run Python scripts…
FEATURE_FREEDOM_AS_FEATURE_TITLE: Freedom as a feature
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  AGPLv3 license protects your freedoms as a user.
  Code is maintained by the community and anyone can audit it.
  No spyware. No data collection. No product placement.
  F-Droid ensures that binaries are generated only from the published source with no hidden additions.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Source Code
