LANGUAGE_NAME: Aragonés
MOTTO: Executa qualsiquier acción con qualsiquier disparador
DESCRIPTION: Ferramienta d'automatización ta Android
KEYWORDS: android, automatización, nfc, drecera, disparador, floss, foss, codigo ubierto, software libre
FEATURE_MULTIPLE_TRIGGERS_TITLE: Esculle un disparador
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Puetz fer servir <b>etiquetas NFC</b>,
  <b>dreceras d'a pantalla d'inicio</b>
  y <b>dispositivos Bluetooth</b>
  como disparadors ta las tuyas automatizacions.
  Disenyau ta estar <b>extensible</b>,
  con más disparadors planiaus ta o futuro como
  eventos d'o sistema, chestos, detección Wi-Fi…
FEATURE_MULTIPLE_COMMANDS_TITLE: Esculle qué executar
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Qué puetz automatizar?
  Actualment, puetz <b>invocar atras aplicacions</b>
  ubriendo pantallas especificas, encetando servicios u ninviando mensaches.
  Tamién puetz cambiar <b>achustes d'o sistema</b>, ubrir panels d'achustes rapidos u ir ta pachinas d'achustes especificas.
  Y finalment, puetz <b>connectar y desconnectar dispositivos Bluetooth</b>.
  Bi ha mas comandas en camín!
FEATURE_FREEDOM_AS_FEATURE_TITLE: Libertat como característica
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  AGPLv3 protege as tuyas libertats como usuario.
  O codigo ye manteniu por a comunidat y cualsiquier puede auditar-lo.
  Sin spyware. Sin recolección de datos. Sin publicidat encubierta.
  F-Droid asegura que os binarios se cheneran nomás dende o codigo fuente publicau sin adicions amagadas.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Codigo fuente
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 u posterior
FEATURE_TRANSLATIONS_TITLE: Traduccions
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Se presta especial atención a lo soporte de luengas minoritarias y rechionals.
  Iste ye un esfuerzo comunitario; traduce a la tuya luenga con Weblate.
