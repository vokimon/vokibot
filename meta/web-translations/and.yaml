FEATURE_TRANSLATIONS_TITLE: Tradûççionê
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Çe prêtta êppeçiâh atençión ar çoporte de lenguâ minoritariâ y rehionalê.
  Êtte êh un êffuerço comunitario; traduçe tu idioma con Weblate.
