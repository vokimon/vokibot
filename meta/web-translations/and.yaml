LANGUAGE_NAME: Andalûh
MOTTO: Ehecuta cuarquiêh âççión con cuarquiêh dîpparadôh
DESCRIPTION: Erramienta de automatiçaçión pa Androîh
KEYWORDS: androîh, automatiçaçión, nfc, âççeço dirêtto, dîpparadôh, floss, foss, código abierto, çôttware libre
FEATURE_MULTIPLE_TRIGGERS_TITLE: Elihe un dîpparadôh
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Puedê uçâh <b>etiquetâ NFC</b> y <b>âççeçô dirêttô en la pantaya de iniçio</b> como dîpparadorê pa tû automatiçaçionê.
  Diçeñao pa çêh <b>êttençible</b>,
  con mâh dîpparadorê planeáô pa er futuro como
  ebentô der çîttema, hêttô, detêççión Wi-Fi/Bluetooth…
FEATURE_MULTIPLE_COMMANDS_TITLE: Elihe qué ehecutâh
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  ¿Qué puedê automatiçâh?
  Âttuarmente, puedê <b>abrîh cuarquiêh aplicaçión</b>
  o çartâh dirêttamente a una pantaya êppeçífica dentro de eya.
  También puedê çartâh dirêttamente a una <b>páhina de ahûttê der çîttema</b> êppeçífica.
  Êttençionê futurâ: Cambiâh ahûttê, ehecutâh scrîtts ADB, ehecutâh scrîtts Python…
FEATURE_FREEDOM_AS_FEATURE_TITLE: Libertá como carâtteríttica
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  ÂPPRb3 protehe tû libertadê como uçuario.
  Er código êh mantenío por la comunidá y cuarquiera puede auditâl-lo.
  Çin spyware. Çin recopilaçión de datô. Çin publiçidá encubierta.
  F-Droid açegura que lô binariô çe heneran únicamente dêdde er código fuente publicao çin adiçionê ocurtâ.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Código fuente
