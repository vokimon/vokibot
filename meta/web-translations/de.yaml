LANGUAGE_NAME: Deutsch
MOTTO: Jede Aktion mit jedem Auslöser starten
DESCRIPTION: Android-Automatisierungstool
KEYWORDS: android, automatisierung, nfc, kurztaste, auslöser, floss, foss, open source, freie software
FEATURE_MULTIPLE_TRIGGERS_TITLE: Wähle einen Auslöser
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Du kannst <b>NFC-Tags</b> und <b>Startbildschirm-Verknüpfungen</b> als Auslöser für deine Automatisierungen verwenden.
  Entwickelt, um <b>erweiterbar</b> zu sein,
  mit weiteren geplanten Auslösern wie
  Systemereignissen, Gesten, Wi-Fi/Bluetooth-Erkennung…
FEATURE_MULTIPLE_COMMANDS_TITLE: Wähle, was ausgeführt werden soll
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Was kannst du automatisieren?
  Derzeit kannst du <b>jede Anwendung öffnen</b>
  oder direkt zu einem bestimmten Bildschirm darin springen.
  Du kannst auch direkt zu einer bestimmten <b>Systemeinstellungsseite</b> springen.
  Zukünftige Erweiterungen: Einstellungen umschalten, ADB-Skripte ausführen, Python-Skripte ausführen…
FEATURE_FREEDOM_AS_FEATURE_TITLE: Freiheit als Feature
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  AGPLv3 schützt deine Freiheiten als Nutzer.
  Der Code wird von der Community gepflegt und jeder kann ihn auditieren.
  Keine Spyware. Keine Datenerfassung. Keine versteckte Werbung.
  F-Droid stellt sicher, dass Binärdateien nur aus dem veröffentlichten Quellcode ohne versteckte Zusätze erzeugt werden.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Quellcode
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 oder später
FEATURE_TRANSLATIONS_TITLE: Übersetzungen
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Minderheiten- und Regionalsprachen werden besonders unterstützt.
  Dies ist ein Gemeinschaftsprojekt; übersetze deine Sprache mit Weblate.
