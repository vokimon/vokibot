LANGUAGE_NAME: Русский
MOTTO: Запускайте любые действия с помощью любых триггеров
DESCRIPTION: Инструмент автоматизации для Android
KEYWORDS: андроид, автоматизация, нфк, ярлык, триггер, свободное по, открытый исходный код
FEATURE_MULTIPLE_TRIGGERS_TITLE: Выберите триггер
FEATURE_MULTIPLE_TRIGGERS_DESCRIPTION: |
  Вы можете использовать <b>NFC-метки</b>,
  <b>ярлыки на главном экране</b>
  и <b>Bluetooth-устройства</b>
  в качестве триггеров для ваших автоматизаций.
  Приложение создано <b>масштабируемым</b>,
  с планами добавить больше триггеров в будущем, таких как
  системные события, жесты, обнаружение Wi-Fi…
FEATURE_MULTIPLE_COMMANDS_TITLE: Выберите действие
FEATURE_MULTIPLE_COMMANDS_DESCRIPTION: |
  Что можно автоматизировать?
  Сейчас вы можете <b>вызывать другие приложения</b>
  открывая определенные экраны, запуская службы или отправляя сообщения.
  Вы также можете изменять <b>системные настройки</b>, открывать панели быстрых настроек или переходить на определенные страницы настроек.
  И наконец, вы можете <b>подключать и отключать Bluetooth-устройства</b>.
  Больше команд уже в пути!
FEATURE_FREEDOM_AS_FEATURE_TITLE: Свобода как особенность
FEATURE_FREEDOM_AS_FEATURE_DESCRIPTION: |
  Лицензия AGPLv3 защищает ваши свободы как пользователя.
  Код поддерживается сообществом, и любой может его проверить.
  Никакого шпионского ПО. Никакого сбора данных. Никакой скрытой рекламы.
  F-Droid гарантирует, что бинарные файлы создаются только из опубликованного исходного кода без скрытых добавлений.
FEATURE_FREEDOM_AS_FEATURE_ACTION_GITHUB: Исходный код
FEATURE_FREEDOM_AS_FEATURE_ACTION_LICENSE: GNU Affero GPLv3 или новее
FEATURE_TRANSLATIONS_TITLE: Переводы
FEATURE_TRANSLATIONS_DESCRIPTION: |
  Особое внимание уделяется поддержке языков меньшинств и региональных языков.
  Это общественная инициатива; переведите приложение на свой язык с помощью Weblate.
