trigger_nfc_help: |
  Dispara automatitzacions quan el dispositiu toca una etiqueta NFC.

  Pots utilitzar la majoria d'objectes sense contacte, com ara
  targetes de transport, de crèdit, polseres d'esdeveniments o d'accés.
  L'etiqueta només s'identifica; no es llegeix ni modifica cap dada.
trigger_shortcut_help: |
  Crea una drecera a la pantalla d'inici que dispara automatitzacions quan s'obre.
command_settings_page_help: |
  Obre una pàgina específica de la configuració d'Android.

  Ignora els menús i et porta directament a la pàgina objectiu.
command_launch_activity_help: |
  Obre una app o salta directament a una pantalla específica dins d'ella.
command_send_broadcast_help: |
  Envía un senyal a una app que suporta difusions personalitzades.

  Sol ser el cas de reproductors multimèdia o eines d'automatització.
command_control_service_help: |
  Inicia o atura un procés en segon pla d'una altra app.
command_access_provider_help: |
  Llegeix o escriu dades compartides exposades per altres apps.

  Aquestes dades solen ser contactes, calendaris o fitxers multimèdia.
