trigger_nfc_help: |
  Aciona automações quando o dispositivo toca numa etiqueta NFC.

  Podes usar a maioria dos objetos sem contacto, como
  cartões de transporte, de crédito, pulseiras de eventos ou de acesso.
  A etiqueta é apenas identificada; nenhum dado é lido ou modificado.
trigger_shortcut_help: |
  Cria um atalho no ecrã inicial que aciona automações quando aberto.
command_settings_page_help: |
  Abre uma página específica das definições do Android.

  Ignora os menus e leva-te diretamente à página alvo.
command_launch_activity_help: |
  Abre uma app ou salta diretamente para um ecrã específico dentro dela.
command_send_broadcast_help: |
  Envia um sinal a uma app que suporta difusões personalizadas.

  É normalmente o caso de leitores multimédia ou ferramentas de automação.
command_control_service_help: |
  Inicia ou para um processo em segundo plano de outra app.
command_access_provider_help: |
  Lê ou escreve dados partilhados expostos por outras apps.

  Estes dados são normalmente contactos, calendários ou ficheiros multimédia.
