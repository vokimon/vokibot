trigger_nfc_help: |
  يشتغل عند لمس الجهاز لعلامة NFC.

  يمكنك استخدام معظم الأجسام التي تعمل بالتلامس، مثل
  بطاقات النقل، وبطاقات الائتمان، وأساور الفعاليات، أو بطاقات الدخول.
  يتم التعرف على العلامة فقط؛ لا تتم قراءة أو تعديل أي بيانات.
trigger_shortcut_help: |
  ينشئ اختصارًا على الشاشة الرئيسية يشتغل عند فتحه.
command_settings_page_help: |
  يفتح صفحة إعدادات محددة في أندرويد.

  يتخطى القوائم ويأخذك مباشرة إلى الصفحة المطلوبة.
command_launch_activity_help: |
  يفتح تطبيقًا أو ينتقل مباشرة إلى شاشة محددة داخله.
command_send_broadcast_help: |
  يرسل إشارة إلى تطبيق يدعم البث المخصص.

  يحدث عادةً مع مشغلات الوسائط أو أدوات الأتمتة.
command_control_service_help: |
  يبدأ أو يوقف عملية تعمل في الخلفية داخل تطبيق آخر.
command_access_provider_help: |
  يقرأ أو يكتب بيانات مشتركة تشاركها تطبيقات أخرى.

  تشمل عادةً جهات الاتصال أو التقويمات أو ملفات الوسائط.
