trigger_nfc_help: |
  Automatizazioak abiarazten ditu gailuak NFC etiketa bat ukitzen duenean.

  Kontakturik gabeko objektu gehienak erabil ditzakezu, hala nola
  garraio txartelak, kreditu txartelak, ekitaldietako eskumuturrekoak edo sarbide txartelak.
  Etiketa identifikatu besterik ez da egiten; ez da daturik irakurtzen edo aldatzen.
trigger_shortcut_help: |
  Hasierako pantailan automatizazioak abiarazten dituen lasterbide bat sortzen du, irekitzean.
command_settings_page_help: |
  Androiden ezarpen-orri zehatz bat irekitzen du.

  Menuak saltatu eta helburuko orrialdera zuzenean eramaten zaitu.
command_launch_activity_help: |
  Aplikazio bat irekitzen du edo bertako pantaila zehatz batera zuzenean jauzi egiten du.
command_send_broadcast_help: |
  Difusio pertsonalizatuak onartzen dituen aplikazio bati seinale bat bidaltzen dio.

  Ohikoa da multimedia erreproduzitzaile edo automatizazio tresnetan.
command_control_service_help: |
  Beste aplikazio bateko atzeko planoeko prozesu bat abiarazi edo gelditzen du.
command_access_provider_help: |
  Beste aplikazio batzuek partekatutako datuak irakurtzen edo idazten ditu.

  Normalean kontaktuak, egutegiak edo multimedia fitxategiak izaten dira.
