trigger_nfc_help: |
  Запускает автоматизации при касании устройством NFC-метки.
  Можно использовать большинство бесконтактных объектов, например
  транспортные карты, банковские карты, браслеты для мероприятий или пропуски.
  Метка только идентифицируется; никакие данные не читаются и не изменяются.
trigger_shortcut_help: |
  Создает ярлык на главном экране, который запускает автоматизации при открытии.
command_settings_page_help: |
  Открывает конкретную страницу настроек Android.
  Пропускает меню и сразу переходит к нужной странице.
command_launch_activity_help: |
  Открывает приложение или сразу переходит на конкретный экран внутри него.
command_send_broadcast_help: |
  Отправляет сигнал приложению, которое поддерживает пользовательские трансляции,
  например медиаплеерам или инструментам автоматизации.
command_control_service_help: |
  Запускает или останавливает фоновый процесс другого приложения.
command_access_provider_help: |
  Читает или записывает общие данные, предоставляемые другими приложениями,
  например контакты, календари или медиафайлы.
